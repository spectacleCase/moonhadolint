name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install MoonBit on Unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Check toolchain
        run: moon version --all

      - name: Check
        run: moon check --target all --deny-warn

      - name: Test portable targets
        run: |
          moon test --target wasm --deny-warn
          moon test --target wasm-gc --deny-warn
          moon test --target js --deny-warn

      - name: Test native and CLI
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          moon test --target native --deny-warn
          moon run --target native cmd/main -- lint examples/good.Dockerfile
          moon run --target native cmd/main -- lint examples/multistage.Dockerfile
          moon run --target native cmd/main -- annotate examples/bad.Dockerfile | grep "DL3006"
          if moon run --target native cmd/main -- lint examples/bad.Dockerfile; then
            echo "bad Dockerfile unexpectedly passed"
            exit 1
          fi

      - name: Verify formatting
        run: moon fmt --check

      - name: Verify interfaces
        run: moon info
